# =========================================================
# IMAGE STORAGE
# Relative paths resolve from the process working directory (user.dir).
# On the server, either run the jar from a writable app folder that contains
# images/thumbnails, or set IMAGE_STORAGE_DIR to an absolute writable path.
# =========================================================

app.images.storage-dir=${IMAGE_STORAGE_DIR:images}
app.images.url-prefix=/images

# =========================================================
# TEST PDF STORAGE
# Relative paths resolve from the process working directory (user.dir).
# =========================================================

app.pdfs.storage-dir=${PDF_STORAGE_DIR:pdfs}
app.pdfs.url-prefix=/pdfs

# =========================================================
# AWS S3 (study materials)
# Prefer IAM role on EC2/ECS; fall back to env keys if needed.
# =========================================================

app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:vibuthar-assets-bucket}
app.aws.s3.key-prefix=${AWS_S3_KEY_PREFIX:study-materials}
app.aws.s3.presign-duration-minutes=${AWS_S3_PRESIGN_MINUTES:15}
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# =========================================================
# RAZORPAY
# =========================================================

app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# =========================================================
