# =========================================================
# PRODUCTION PROFILE
# =========================================================

server.port=8080

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://YOUR_PROD_DB_HOST:3306/academy_db?useSSL=true&serverTimezone=Asia/Kolkata
spring.datasource.username=YOUR_PROD_DB_USERNAME
spring.datasource.password=YOUR_PROD_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# =========================================================
# JWT (required — secret must be at least 32 characters)
# Set these via environment variables on the live server.
# =========================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:YOUR_FRONTEND_ORIGIN}

# =========================================================
# IMAGE STORAGE
# =========================================================

app.images.storage-dir=images
app.images.url-prefix=/images

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN