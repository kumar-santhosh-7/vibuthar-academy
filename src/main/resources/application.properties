# =========================================================
# APPLICATION
# =========================================================
spring.application.name=project

# =========================================================
# COMMON JPA / HIBERNATE
# =========================================================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Gallery images (filesystem folder relative to working directory)
app.images.storage-dir=images
app.images.url-prefix=/images

# Test reference PDFs (filesystem folder relative to working directory)
app.pdfs.storage-dir=pdfs
app.pdfs.url-prefix=/pdfs

# =========================================================
# AWS S3 (study materials)
# Credentials: prefer env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# or an IAM role on the server. Optional explicit keys below.
# =========================================================
app.aws.region=ap-south-1
app.aws.s3.bucket=vibuthar-assets-bucket
app.aws.s3.key-prefix=study-materials
app.aws.s3.presign-duration-minutes=15
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# =========================================================
# RAZORPAY (course subscription payments)
# Never expose key-secret or webhook-secret to the frontend.
# =========================================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# =========================================================
# TIMEZONE
# =========================================================
spring.jackson.time-zone=Asia/Kolkata