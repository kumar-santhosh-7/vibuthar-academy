# Academy contact
#academy.contact.email=kwivrainnovations@gmail.com

# =========================================================
# JWT
# =========================================================

app.jwt.secret=academy-api-jwt-secret-key-2026-this-must-be-long-enough
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=http://localhost:3000

# =========================================================
# IMAGE STORAGE
# =========================================================

app.images.storage-dir=images
app.images.url-prefix=/images

# =========================================================
# TEST PDF STORAGE
# =========================================================

app.pdfs.storage-dir=pdfs
app.pdfs.url-prefix=/pdfs

# =========================================================
# AWS S3 (study materials)
# =========================================================

app.aws.region=ap-south-1
app.aws.s3.bucket=vibuthar-assets-bucket
app.aws.s3.key-prefix=study-materials
app.aws.s3.presign-duration-minutes=15
app.aws.access-key=${AWS_ACCESS_KEY_ID:}
app.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}

# =========================================================
# RAZORPAY
# =========================================================

app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE