# =========================================================
# DEVELOPMENT PROFILE
# =========================================================

server.port=8080

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/academy_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# MAIL (SMTP temporarily disabled for student interest)
# =========================================================

